name: Android installer
on:
  workflow_dispatch:
    inputs:
      booking_url:
        description: Public HTTPS origin of the live booking server (not Pages)
        required: true
        type: string
      version_name:
        description: Android release version label
        default: "1.0.0"
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify signed APK
        env:
          BOOKING_URL: ${{ inputs.booking_url }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_B64:?Configure the Android signing secrets before building a release}"
          umask 077
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/maison-noir-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          unset ANDROID_KEYSTORE_B64
          ./android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: maison-noir-android-installer
          path: android/output/maison-noir-booking.apk
          if-no-files-found: error
